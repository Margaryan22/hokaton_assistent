[project]
name = "voice-planner"
version = "0.1.0"
description = "Голосовой ассистент для задач, напоминаний и встреч"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pymorphy3>=2.0",
    "pymorphy3-dicts-ru>=2.4",
    "rapidfuzz>=3.9",
    "anthropic>=1.13",
    "tzdata>=2024.1",
    "numpy>=1.26",
]

[project.optional-dependencies]
ml = [
    "hf-xet>=1.0",
    "llama-cpp-python>=0.3.36",
    "onnx-asr[cpu,hub]>=0.12",
    "sentence-transformers>=5.0",
    "silero>=0.5.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
